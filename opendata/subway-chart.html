<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지하철 혼잡도 — 하루 그래프</title>
<style>
  :root{
    --bg:#f1f4f7; --card:#fff; --ink:#16202a; --ink2:#5c6f80; --ink3:#93a3b3;
    --line:#dde4ec; --teal:#177d8c;
    --data-1:#cde2fb; --data-2:#86b6ef; --data-3:#3987e5; --data-4:#1c5cab;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px 14px 60px;background:var(--bg);color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.5px}
  .sub{margin:0 0 20px;color:var(--ink2);font-size:13.5px}

  .filters{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:16px}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .row:last-child{margin-bottom:0}
  .lbl{font-size:11.5px;color:var(--ink3);font-weight:bold;width:42px;flex:0 0 auto}
  .chip{font-size:13px;padding:5px 11px;border:1px solid var(--line);background:#fff;
    border-radius:20px;cursor:pointer;font-family:inherit;color:var(--ink2)}
  .chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:bold}
  select{flex:1;min-width:150px;padding:9px 10px;border:1px solid var(--line);
    border-radius:8px;font-size:14px;font-family:inherit;background:#fff}

  /* ── 그래프 ─────────────────────────────────────── */
  .chart{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 16px 12px;margin-bottom:14px}
  .chart h2{font-size:15px;margin:0 0 2px}
  .chart .cap{font-size:12.5px;color:var(--ink3);margin:0 0 18px}

  .plot{position:relative;height:190px;display:flex;align-items:flex-end;gap:2px}
  /* 정원 100% 기준선 — 눈에 띄되 데이터보다 뒤로 물러나게 */
  .plot .base{position:absolute;left:0;right:0;border-top:1px dashed #b8c4d0;
    font-size:10.5px;color:var(--ink3);pointer-events:none}
  .plot .base span{background:var(--card);padding:0 4px;position:relative;top:-8px}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;
    height:100%;position:relative;cursor:default}
  .col i{display:block;width:100%;background:var(--data-2);
    border-radius:3px 3px 0 0;min-height:1px}
  .col.hi i{background:var(--data-4)}
  /* 숨길 때 display:none 으로 지웁니다. opacity:0 으로만 두면 보이지 않는 채로
     자리를 차지해서 폰에서 가로 스크롤이 생깁니다 */
  .col .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    background:#16202a;color:#fff;font-size:11.5px;padding:4px 8px;border-radius:5px;
    white-space:nowrap;margin-bottom:5px;pointer-events:none;
    font-variant-numeric:tabular-nums;z-index:2}
  .col:hover .tip,.col:focus-visible .tip{display:block}
  /* 양 끝 막대는 말풍선이 화면 밖으로 나가지 않게 안쪽으로 붙입니다 */
  .col:nth-child(-n+4) .tip{left:0;transform:none}
  .col:nth-last-child(-n+3) .tip{left:auto;right:0;transform:none}
  .col:hover i{filter:brightness(.92)}
  /* 최고점만 숫자를 직접 붙입니다. 전부 붙이면 아무것도 안 읽힙니다 */
  .col .lab{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    font-size:11px;font-weight:bold;color:var(--data-4);margin-bottom:3px;white-space:nowrap}

  .xaxis{display:flex;gap:2px;margin-top:6px}
  .xaxis span{flex:1;min-width:0;font-size:9.5px;color:var(--ink3);text-align:center;
    overflow:hidden}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;margin-top:16px}
  .stat{background:#f6f9fc;border:1px solid var(--line);border-radius:9px;padding:11px 13px}
  .stat .k{font-size:11.5px;color:var(--ink3)}
  .stat .v{font-size:19px;font-weight:bold;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .stat .v small{font-size:12.5px;font-weight:normal;color:var(--ink2)}

  .found{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .found h2{font-size:15px;margin:0 0 4px}
  .found p{font-size:13px;color:var(--ink2);margin:0 0 10px}
  textarea{width:100%;min-height:74px;padding:11px 12px;border:1px solid var(--line);
    border-radius:8px;font-size:14px;font-family:inherit;line-height:1.6;resize:vertical}

  .msg{background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:28px 16px;text-align:center;color:var(--ink3);font-size:13.5px}
  footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink3)}
</style>
</head>
<body>
<div class="wrap">

  <h1>📊 하루 동안의 혼잡도</h1>
  <p class="sub">역 하나를 골라 새벽 5시 반부터 자정까지를 봅니다</p>

  <div class="filters">
    <div class="row"><span class="lbl">요일</span><span id="요일칸"></span></div>
    <div class="row"><span class="lbl">방향</span><span id="방향칸"></span></div>
    <div class="row"><span class="lbl">역</span><select id="역선택"></select></div>
  </div>

  <div id="화면"><div class="msg">데이터를 불러오는 중…</div></div>

  <footer>
    자료: 서울교통공사 지하철 혼잡도 정보 (2026-03-31 기준) · 혼잡도 100% = 열차 정원
  </footer>
</div>

<script>
let 전체 = [], 시간표 = [];
let 고른요일 = "평일", 고른방향 = null, 고른역 = null;

불러오기();

async function 불러오기() {
  try {
    const 자료 = await (await fetch("./subway.json")).json();
    전체 = 자료.자료;
    시간표 = 자료.시간표;
    준비();
  } catch (에러) {
    document.getElementById("화면").innerHTML =
      '<div class="msg">데이터를 불러오지 못했습니다.<br><br>' +
      '파일을 <b>더블클릭해서 열면</b> 브라우저가 막습니다.<br>' +
      'VS Code의 <b>Live Server</b>로 열거나, 배포한 주소로 접속하세요.</div>';
    console.error(에러);
  }
}

function 준비() {
  const 요일들 = ["평일", "토요일", "일요일"];
  document.getElementById("요일칸").innerHTML = 요일들.map(값 =>
    `<button class="chip" data-값="${값}" aria-pressed="${값 === 고른요일}">${값}</button>`).join(" ");

  const 역들 = [...new Set(전체.map(r => r.역명))].sort((가, 나) => 가.localeCompare(나, "ko"));
  고른역 = 역들.includes("사당") ? "사당" : 역들[0];
  document.getElementById("역선택").innerHTML = 역들.map(값 =>
    `<option${값 === 고른역 ? " selected" : ""}>${안전(값)}</option>`).join("");

  document.getElementById("요일칸").addEventListener("click", 사건 => {
    const 버튼 = 사건.target.closest(".chip");
    if (!버튼) return;
    고른요일 = 버튼.dataset.값;
    for (const 형제 of 버튼.parentElement.children)
      형제.setAttribute("aria-pressed", 형제 === 버튼);
    그리기();
  });
  document.getElementById("방향칸").addEventListener("click", 사건 => {
    const 버튼 = 사건.target.closest(".chip");
    if (!버튼) return;
    고른방향 = 버튼.dataset.값;
    그리기();
  });
  document.getElementById("역선택").addEventListener("change", 사건 => {
    고른역 = 사건.target.value;
    고른방향 = null;          // 역이 바뀌면 방향은 다시 고릅니다
    그리기();
  });
  그리기();
}

function 그리기() {
  const 후보 = 전체.filter(r => r.역명 === 고른역 && r.요일 === 고른요일);
  // 처음 볼 때는 더 붐비는 쪽을 보여줍니다 (사당 내선 126% vs 외선 147%)
  const 방향들 = [...new Set(후보.map(r => r.방향))];
  if (!방향들.includes(고른방향)) {
    고른방향 = [...후보].sort((가, 나) => 나.최대혼잡 - 가.최대혼잡)[0]?.방향;
  }

  // 사당처럼 두 노선이 만나는 역은 방향이 4개입니다. 그럴 때만 호선을 같이 적습니다
  const 호선수 = new Set(후보.map(r => r.호선)).size;
  document.getElementById("방향칸").innerHTML = 방향들.map(값 => {
    const 줄 = 후보.find(r => r.방향 === 값).호선;
    const 이름 = 호선수 > 1 ? `${줄} ${값}` : 값;
    return `<button class="chip" data-값="${값}" aria-pressed="${값 === 고른방향}">${안전(이름)}</button>`;
  }).join(" ");

  const 역 = 후보.find(r => r.방향 === 고른방향);
  if (!역) { document.getElementById("화면").innerHTML = '<div class="msg">자료가 없습니다</div>'; return; }

  const 값들 = 시간표.map(t => 역.시간대[t]);
  const 최대 = Math.max(...값들);
  const 꼭대기 = Math.max(최대, 100) * 1.12;        // 기준선이 잘리지 않게 여유
  const 평균 = 값들.reduce((ㄱ, ㄴ) => ㄱ + ㄴ, 0) / 값들.length;

  const 막대 = 시간표.map((시각, i) => {
    const 값 = 값들[i];
    const 최고 = 값 === 최대;
    return `<div class="col${최고 ? " hi" : ""}" tabindex="0">
        ${최고 ? `<span class="lab">${값}%</span>` : ""}
        <span class="tip">${시각} · ${값}%</span>
        <i style="height:${값 / 꼭대기 * 100}%"></i>
      </div>`;
  }).join("");

  // 30분 간격이라 전부 쓰면 겹칩니다. 2시간마다 하나만 씁니다
  const 눈금 = 시간표.map((시각, i) =>
    `<span>${i % 4 === 0 ? 시각.slice(0, 2) : ""}</span>`).join("");

  document.getElementById("화면").innerHTML = `
    <div class="chart">
      <h2>${안전(역.호선)} ${안전(역.역명)} · ${안전(역.방향)} · ${안전(역.요일)}</h2>
      <p class="cap">막대 하나가 30분입니다. 점선은 정원(100%)이에요.</p>
      <div class="plot">
        <div class="base" style="bottom:${100 / 꼭대기 * 100}%"><span>정원 100%</span></div>
        ${막대}
      </div>
      <div class="xaxis">${눈금}</div>

      <div class="stats">
        <div class="stat"><div class="k">가장 붐빌 때</div>
          <div class="v">${역.최대혼잡}% <small>${역.최대시각}</small></div></div>
        <div class="stat"><div class="k">하루 평균</div>
          <div class="v">${평균.toFixed(1)}%</div></div>
        <div class="stat"><div class="k">정원을 넘는 시간</div>
          <div class="v">${(값들.filter(v => v > 100).length * 0.5).toFixed(1)}<small>시간</small></div></div>
      </div>
    </div>

    <div class="found">
      <h2>이 그래프를 보고 알게 된 것</h2>
      <p>한 줄이면 충분합니다. 왜 그 시각에 사람이 몰릴까요? 요일을 바꾸면 어떻게 달라지나요?</p>
      <textarea placeholder="예) 평일 8시대가 압도적으로 높은데, 일요일로 바꾸면 그 봉우리가 사라진다. 출근하는 사람들 때문인 것 같다."></textarea>
    </div>`;
}

function 안전(글자) {
  return String(글자).replace(/[&<>"]/g, ㄱ =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ㄱ]));
}
</script>
</body>
</html>
