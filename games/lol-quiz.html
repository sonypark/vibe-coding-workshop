<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>롤 챔피언 맞히기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 14px;
    background: #0a1428; color: #f0e6d2;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; justify-content: center; touch-action: manipulation;
  }
  .wrap { width: 100%; max-width: 400px; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 24px; color: #c8aa6e; letter-spacing: -.5px; }
  .top { display: flex; justify-content: space-between; margin: 12px 2px 14px; font-size: 15px; color: #a09b8c; }
  .top b { color: #f0e6d2; font-variant-numeric: tabular-nums; }

  .pic {
    width: 190px; height: 190px; margin: 0 auto 6px; border-radius: 14px; overflow: hidden;
    border: 3px solid #c8aa6e; background: #1e2328; position: relative;
  }
  .pic img { width: 100%; height: 100%; object-fit: cover; transition: filter .3s; }
  .pic.blur img { filter: blur(14px) brightness(.9); }
  .tag { min-height: 22px; font-size: 14px; color: #a09b8c; margin-bottom: 14px; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choices button {
    font-size: 17px; font-weight: bold; font-family: inherit; padding: 16px 8px;
    border-radius: 10px; border: 2px solid #785a28; background: #1e2328; color: #f0e6d2; cursor: pointer;
  }
  .choices button:active { transform: scale(.97); }
  .choices button.right { background: #1e5631; border-color: #3fb950; }
  .choices button.wrong { background: #5c1a1a; border-color: #e5534b; }
  .choices button:disabled { cursor: default; }

  .msg { margin-top: 18px; min-height: 26px; font-size: 17px; }
  .next {
    margin-top: 8px; font-size: 17px; font-weight: bold; font-family: inherit; padding: 12px 34px;
    border: 0; border-radius: 26px; background: #c8aa6e; color: #0a1428; cursor: pointer; display: none;
  }
  .err { margin-top: 30px; color: #e5534b; line-height: 1.7; }
  footer { margin-top: 26px; font-size: 11px; color: #5b5a56; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚔️ 이 챔피언은 누구?</h1>
  <div class="top">
    <span>문제 <b id="round">0</b>/10</span>
    <span>점수 <b id="score">0</b></span>
  </div>

  <div id="game">
    <div class="pic blur" id="pic"><img id="img" alt=""></div>
    <div class="tag" id="tag">불러오는 중…</div>
    <div class="choices" id="choices"></div>
    <div class="msg" id="msg"></div>
    <button class="next" id="next">다음 문제</button>
  </div>

  <footer>챔피언 이미지·데이터 © Riot Games · 비상업 팬 콘텐츠</footer>
</div>

<script>
  // 라이엇이 공개한 데이터 — API 키 없이 누구나 읽을 수 있습니다
  const 주소 = "https://ddragon.leagueoflegends.com";
  const 문제수 = 10;
  const 역할한글 = { Fighter: "전사", Tank: "탱커", Mage: "마법사",
                    Assassin: "암살자", Marksman: "원거리", Support: "서포터" };

  let 버전 = "16.17.1", 챔피언들 = [], 순서 = [], 회차 = 0, 점수 = 0, 총문제 = 문제수;

  불러오기();

  async function 불러오기() {
    try {
      try { 버전 = (await (await fetch(`${주소}/api/versions.json`)).json())[0]; } catch (e) {}
      const 자료 = await (await fetch(`${주소}/cdn/${버전}/data/ko_KR/champion.json`)).json();
      챔피언들 = Object.values(자료.data);   // 객체 → 배열
      // 챔피언이 문제 수보다 적으면 있는 만큼만 냅니다 (역할로 범위를 좁혔을 때 등)
      총문제 = Math.min(문제수, 챔피언들.length);
      순서 = 섞기([...챔피언들]).slice(0, 총문제);
      document.querySelector(".top span").innerHTML = `문제 <b id="round">0</b>/${총문제}`;
      다음문제();
    } catch (e) {
      document.getElementById("game").innerHTML =
        `<div class="err">챔피언 데이터를 불러오지 못했습니다.<br>
         인터넷 연결을 확인하거나,<br>학교·회사 네트워크라면 막혀 있을 수 있어요.</div>`;
    }
  }

  function 다음문제() {
    if (회차 >= 총문제) return 끝();
    const 정답 = 순서[회차];
    회차++;
    document.getElementById("round").textContent = 회차;
    document.getElementById("msg").textContent = "";
    document.getElementById("next").style.display = "none";

    const pic = document.getElementById("pic");
    pic.classList.add("blur");
    document.getElementById("img").src = `${주소}/cdn/${버전}/img/champion/${정답.image.full}`;
    document.getElementById("tag").textContent =
      "힌트: " + 정답.tags.map(t => 역할한글[t] || t).join(" · ");

    // 오답 3개 + 정답 1개
    const 보기 = 섞기([정답, ...섞기(챔피언들.filter(c => c.id !== 정답.id)).slice(0, 3)]);
    const box = document.getElementById("choices");
    box.innerHTML = "";
    보기.forEach(c => {
      const b = document.createElement("button");
      b.textContent = c.name;
      b.addEventListener("click", () => 골랐다(b, c, 정답));
      box.appendChild(b);
    });
  }

  function 골랐다(버튼, 고른것, 정답) {
    document.querySelectorAll(".choices button").forEach(b => {
      b.disabled = true;
      if (b.textContent === 정답.name) b.classList.add("right");
    });
    document.getElementById("pic").classList.remove("blur");
    if (고른것.id === 정답.id) {
      점수++;
      document.getElementById("msg").textContent = `정답! ${정답.name} — ${정답.title}`;
    } else {
      버튼.classList.add("wrong");
      document.getElementById("msg").textContent = `아쉬워요. 정답은 ${정답.name}`;
    }
    document.getElementById("score").textContent = 점수;
    const n = document.getElementById("next");
    n.textContent = 회차 >= 총문제 ? "결과 보기" : "다음 문제";
    n.style.display = "inline-block";
  }

  document.getElementById("next").addEventListener("click", 다음문제);

  function 끝() {
    const 비율 = 점수 / 총문제;
    const 평 = 비율 >= .9 ? "🏆 롤 박사" : 비율 >= .6 ? "👍 꽤 하시네요" : 비율 >= .3 ? "🙂 좋아요" : "🌱 이제 시작";
    document.getElementById("game").innerHTML = `
      <div style="margin-top:40px;font-size:46px;font-weight:800;color:#c8aa6e">${점수} / ${총문제}</div>
      <div style="margin:10px 0 26px;font-size:19px">${평}</div>
      <button class="next" style="display:inline-block" onclick="location.reload()">다시 하기</button>`;
  }

  function 섞기(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
</script>
</body>
</html>
