<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두더지 잡기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #7cb342; color: #3e2a14;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; touch-action: manipulation; user-select: none;
  }
  h1 { margin: 0 0 4px; font-size: 28px; color: #fff; text-shadow: 0 2px 0 #4a7a1f; }
  .bar {
    display: flex; gap: 10px; margin: 14px 0 18px; width: 100%; max-width: 360px;
  }
  .box {
    flex: 1; background: #fff8e1; border-radius: 12px; padding: 8px 10px; text-align: center;
    box-shadow: 0 3px 0 #c5a96a;
  }
  .box small { display: block; font-size: 12px; color: #8d6e3f; }
  .box b { font-size: 24px; }

  .field {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    width: 100%; max-width: 360px;
  }
  .hole {
    aspect-ratio: 1; border-radius: 50%; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 70%, #3e2a14 0 45%, #5d4021 46% 60%, #6b8f2e 61%);
    cursor: pointer;
  }
  .mole {
    position: absolute; left: 50%; bottom: -70%; width: 66%;
    transform: translateX(-50%); font-size: 56px; text-align: center;
    transition: bottom .12s ease-out; pointer-events: none;
  }
  .hole.up .mole { bottom: 8%; }
  .hole.hit .mole { transform: translateX(-50%) scale(.8) rotate(-12deg); filter: grayscale(.6); }

  button.start {
    margin-top: 22px; font-size: 20px; font-weight: bold; font-family: inherit;
    padding: 14px 40px; border: 0; border-radius: 30px; cursor: pointer;
    background: #ff7043; color: #fff; box-shadow: 0 4px 0 #bf360c;
  }
  button.start:active { transform: translateY(3px); box-shadow: 0 1px 0 #bf360c; }
  button.start:disabled { background: #bdbdbd; box-shadow: 0 4px 0 #9e9e9e; }
  .msg { margin-top: 14px; font-size: 17px; color: #fff; min-height: 1.4em; text-align: center; }
</style>
</head>
<body>
  <h1>🔨 두더지 잡기</h1>
  <div class="bar">
    <div class="box"><small>점수</small><b id="score">0</b></div>
    <div class="box"><small>남은 시간</small><b id="time">30</b></div>
    <div class="box"><small>최고 기록</small><b id="best">0</b></div>
  </div>

  <div class="field" id="field"></div>

  <button class="start" id="startBtn">시작!</button>
  <div class="msg" id="msg">두더지가 올라오면 톡 치세요</div>

<script>
  // ── 여기 숫자만 바꿔도 게임이 달라집니다 ──
  const 게임시간 = 30;      // 초
  const 올라와있는시간 = 800; // 밀리초 — 작을수록 어려움
  const 두더지 = "🐹";

  const field = document.getElementById("field");
  const holes = [];
  for (let i = 0; i < 9; i++) {
    const h = document.createElement("div");
    h.className = "hole";
    h.innerHTML = `<div class="mole">${두더지}</div>`;
    h.addEventListener("pointerdown", () => 때리기(h));
    field.appendChild(h);
    holes.push(h);
  }

  let 점수 = 0, 남은시간 = 0, 진행중 = false, 타이머, 등장;
  let 최고 = 0;
  try { 최고 = Number(localStorage.getItem("mole-best")) || 0; } catch (e) {}
  document.getElementById("best").textContent = 최고;

  document.getElementById("startBtn").addEventListener("click", 시작);

  function 시작() {
    점수 = 0; 남은시간 = 게임시간; 진행중 = true;
    화면갱신();
    document.getElementById("startBtn").disabled = true;
    document.getElementById("msg").textContent = "";
    타이머 = setInterval(() => {
      남은시간--;
      화면갱신();
      if (남은시간 <= 0) 끝();
    }, 1000);
    다음두더지();
  }

  function 다음두더지() {
    if (!진행중) return;
    const h = holes[Math.floor(Math.random() * holes.length)];
    h.classList.remove("hit");
    h.classList.add("up");
    등장 = setTimeout(() => {
      h.classList.remove("up");
      setTimeout(다음두더지, 200 + Math.random() * 300);
    }, 올라와있는시간);
  }

  function 때리기(h) {
    if (!진행중 || !h.classList.contains("up") || h.classList.contains("hit")) return;
    h.classList.add("hit");
    점수++;
    화면갱신();
    if (navigator.vibrate) navigator.vibrate(30);
  }

  function 끝() {
    진행중 = false;
    clearInterval(타이머); clearTimeout(등장);
    holes.forEach(h => h.classList.remove("up", "hit"));
    document.getElementById("startBtn").disabled = false;
    document.getElementById("startBtn").textContent = "다시 하기";
    let 문구 = `끝! ${점수}마리 잡았어요`;
    if (점수 > 최고) {
      최고 = 점수;
      try { localStorage.setItem("mole-best", 최고); } catch (e) {}
      문구 += " 🎉 신기록!";
    }
    document.getElementById("msg").textContent = 문구;
    화면갱신();
  }

  function 화면갱신() {
    document.getElementById("score").textContent = 점수;
    document.getElementById("time").textContent = 남은시간;
    document.getElementById("best").textContent = 최고;
  }
</script>
</body>
</html>
