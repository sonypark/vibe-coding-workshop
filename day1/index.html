<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1회차 — 바이브코딩 워크숍</title>
<style>
  :root{
    --ground:#eef2f4; --card:#fff; --ink:#14303a; --ink2:#4d6a75; --ink3:#8ba3ad;
    --line:#dae3e7; --deep:#14303a; --deep2:#1d4a52;
    --coral:#d9553a; --coral-soft:#fbeae6;
    --teal:#177d8c; --teal-soft:#e3f1f3;
    --gold:#a8761f; --gold-soft:#fbf1de;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",
                "Noto Sans KR",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}

  /* ---- hero ---- */
  .hero{
    background:linear-gradient(135deg,var(--deep) 0%,var(--deep2) 100%);
    color:#fff; padding:54px 0 46px; position:relative; overflow:hidden;
  }
  .hero::after{
    content:""; position:absolute; inset:0; opacity:.07; pointer-events:none;
    background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 11px);
  }
  .hero .wrap{position:relative}
  .kicker{
    font-size:11.5px; letter-spacing:2.4px; text-transform:uppercase;
    color:#8fd0d8; font-weight:700; margin:0 0 12px;
  }
  .hero h1{font-size:clamp(27px,5.2vw,40px);line-height:1.2;margin:0 0 12px;letter-spacing:-.8px}
  .hero p{margin:0;color:#b8d3d9;font-size:16px;word-break:keep-all}
  .back{
    display:inline-flex;align-items:center;gap:6px;color:#8fd0d8;text-decoration:none;
    font-size:13.5px;font-weight:600;margin-bottom:16px;
  }
  .back:hover{color:#fff}

  /* ---- sections ---- */
  main{padding:38px 0 72px}
  h2{font-size:17px;margin:36px 0 3px;display:flex;align-items:center;gap:9px}
  h2:first-child{margin-top:0}
  .sub{margin:0 0 16px;font-size:14px;color:var(--ink3)}

  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
  .g2{grid-template-columns:repeat(auto-fit,minmax(265px,1fr))}

  a.card{
    display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px;text-decoration:none;position:relative;overflow:hidden;
    transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;
  }
  a.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal)}
  a.card.coral::before{background:var(--coral)}
  a.card.gold::before{background:var(--gold)}
  a.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px -14px rgba(20,48,58,.5);border-color:#b9ccd3}
  a.card:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  .card .eyebrow{
    font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;
    color:var(--teal);margin-bottom:7px;
  }
  .card.coral .eyebrow{color:var(--coral)}
  .card.gold .eyebrow{color:var(--gold)}
  .card h3{margin:0 0 6px;font-size:18px;letter-spacing:-.3px}
  .card p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.6}
  .card .meta{
    margin-top:12px;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px;
  }
  .card .go{margin-left:auto;font-weight:700;color:var(--teal)}
  .card.coral .go{color:var(--coral)} .card.gold .go{color:var(--gold)}

  /* step card (번호형) */
  .step{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;
    display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:start;min-width:0;
  }
  .step > div{min-width:0}
  .step h3{margin:0 0 6px;font-size:18px;letter-spacing:-.3px}
  .step p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.6}
  .step .n{
    width:38px;height:38px;border-radius:11px;background:var(--teal-soft);color:var(--teal);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  }
  .step.hl{border-color:var(--gold);background:var(--gold-soft)}
  .step.hl .n{background:#f2e2c2;color:var(--gold)}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;
    background:var(--teal-soft);color:var(--teal);margin-left:6px;vertical-align:2px;letter-spacing:0}
  .tag.cont{background:#eef0f3;color:var(--ink2)}
  .tag.none{background:#f2e2c2;color:var(--gold)}

  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .acts a,.acts button{
    font:inherit;font-size:13.5px;font-weight:700;padding:8px 13px;border-radius:9px;cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;gap:5px;
  }
  .acts a{background:var(--ink,#14201f);color:#fff;border:1px solid transparent}
  .acts a:hover{background:var(--teal)}
  .copy{background:#fff;color:var(--teal);border:1px solid #b9d7dc}
  .copy:hover{background:var(--teal-soft)}
  .copy.done{background:var(--teal);color:#fff;border-color:var(--teal)}
  details{margin-top:10px}
  summary{font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer}
  pre{
    background:#f3f6f5;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin:8px 0 0;
    font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink,#14201f);
  }
  pre mark{background:#fde9b8;color:inherit;border-radius:3px;padding:0 2px}
  .howto{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--ink2);line-height:1.7}

  .tip{
    border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:10px;
    padding:15px 17px;margin:18px 0 0;font-size:13.5px;color:#654a17;line-height:1.65;
  }
  .tip.warn{border-left-color:var(--coral);background:var(--coral-soft);color:#7c3320}
  .tip b{font-weight:700}
  .tip code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12.5px}

  .empty{
    background:var(--card);border:1px dashed var(--line);border-radius:14px;
    padding:30px 20px;text-align:center;color:var(--ink3);font-size:13.5px;
  }
  footer{
    border-top:1px solid var(--line);margin-top:46px;padding-top:20px;
    font-size:12.5px;color:var(--ink3);line-height:1.7;
  }
  @media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
<body>
  <div class="hero">
    <div class="wrap">
      <a class="back" href="../index.html">← 홈으로</a>
      <p class="kicker">1회차 · 180분</p>
      <h1>자기소개 카드 만들기</h1>
      <p>처음부터 다시 만드는 게 아닙니다. 같은 index.html 에 계속 덧붙입니다.</p>
    </div>
  </div>
  <main><div class="wrap">
    <h2>📄 단계별 결과물 + 프롬프트</h2>
    <p class="sub">위에서부터 순서대로. 프롬프트의 <mark style="background:#fde9b8;border-radius:3px;padding:0 3px">⟨ ⟩</mark> 부분은 <b>내 이야기로 바꿔서</b> 보내세요. 안 바꾸면 모두 똑같은 페이지가 됩니다.</p>
    <div class="grid" id="steps"></div>

    <footer>바이브코딩 워크숍 · 1회차</footer>
  </div></main>

<script>
  const 단계들 = [
  {
    "n": 1,
    "제목": "자기소개 카드",
    "설명": "일부러 작게 시작합니다. 이걸로 첫 배포를 합니다",
    "파일": "step1.html",
    "대화": "새 대화",
    "프롬프트": "웹페이지를 하나 만들어줘. 코딩은 처음이야.\n\n만들 것: 자기소개 카드 한 장\n- 맨 위에 큰 이모지 하나\n- 이름과 한 줄 소개\n- 좋아하는 것 3개를 둥근 태그 모양으로\n- 맨 아래에 링크 버튼 1개\n\n내 정보:\n- 이모지: ⟨🌊⟩\n- 이름: ⟨김서연⟩\n- 소개: ⟨바다랑 코딩을 좋아하는 고등학교 2학년입니다⟩\n- 좋아하는 것: ⟨농구, 뉴진스, 해양생물⟩\n- 버튼 글자: ⟨내 깃허브⟩\n\n조건:\n- 파일은 index.html 하나만. CSS도 그 안에 넣어줘\n- 한글이 깨지지 않게, 휴대폰 화면 크기에 맞게 만들어줘\n- 흰색 카드가 가운데 떠 있고 배경은 연한 색\n- 휴대폰 세로 화면에서 옆으로 스크롤이 안 생기게\n- 가로 크기는 고정하지 말고 화면에 맞춰 늘어나게\n- 전체 코드를 한 번에 보여줘"
  },
  {
    "n": 2,
    "제목": "＋ D-day 카운터",
    "설명": "맨 위에 카운터만 얹습니다. 날짜 한 줄만 바꾸면 뭐든 됩니다",
    "파일": "step2.html",
    "대화": "이어서",
    "프롬프트": "지금 페이지 맨 위에 D-day 카운터를 추가해줘.\n\n- 남은 날을 \"D-297\" 형식으로 아주 크게\n- 그 아래에 무슨 날인지 작게\n- 카드처럼 둥근 상자 안에, 색이 있는 배경으로\n\n내 D-day:\n- 목표 날짜: ⟨2027-11-18⟩\n- 무슨 날: ⟨수능까지⟩\n\n조건:\n- 아래 자기소개 카드는 하나도 건드리지 마\n- 지금 쓰는 색과 어울리게\n- 날짜는 내가 쉽게 바꿀 수 있게 코드 맨 위에 두고 주석 달아줘\n- 전체 코드 말고, 추가할 부분만 보여주고 어디에 넣는지 알려줘"
  },
  {
    "n": 3,
    "제목": "＋ 만다라트 목표판",
    "설명": "칸을 눌러 고칠 수 있고, 새로고침해도 남습니다",
    "파일": "step3.html",
    "대화": "새 대화",
    "프롬프트": "3x3 격자의 만다라트 목표판을 만들어줘. 코딩은 처음이야.\n\n- 가운데 칸에 큰 목표 1개, 둘레 8칸에 세부 목표\n- 칸을 클릭하면 그 자리에서 바로 글자를 고칠 수 있게\n- 고친 내용은 새로고침해도 그대로 남게\n\n내 목표:\n- 가운데: ⟨해양생물학과 진학⟩\n- 둘레 8개: ⟨매일 30분 영어 듣기 / 수학 오답노트 / 주 3회 운동 / 독서 월 2권 / 과학 동아리 발표 / 7시간 수면 / 봉사활동 20시간 / 코딩 포트폴리오⟩\n\n조건:\n- HTML, CSS, 자바스크립트를 한 덩어리로 줘 (기존 페이지에 붙여넣을 거야)\n- 가운데 칸만 색을 다르게 해서 눈에 띄게\n- 칸은 정사각형으로, 휴대폰에서도 9칸이 다 보이게\n- 위에 \"나의 목표\"라는 제목과 \"칸을 눌러서 고칠 수 있어요\"라는 안내문\n- 한 번에 보여줘"
  }
];

  const 안전 = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const 대화표 = { "새 대화": "", "이어서": "cont", "AI 없음": "none" };

  document.getElementById("steps").innerHTML = 단계들.map((d, i) => `
    <div class="card step${d.강조 ? " hl" : ""}">
      <div class="n">${d.n}</div>
      <div>
        <h3>${d.제목}<span class="tag ${대화표[d.대화]}">${d.대화}</span></h3>
        <p>${d.설명}</p>
        ${d.직접 ? `<ul class="howto">${d.직접.map(t => `<li>${안전(t)}</li>`).join("")}</ul>` : ""}
        <div class="acts">
          <a href="${d.파일}">결과물 열기 →</a>
          ${d.프롬프트 ? `<button class="copy" type="button" data-i="${i}">📋 프롬프트 복사</button>` : ""}
        </div>
        ${d.프롬프트 ? `<details><summary>프롬프트 보기${d.메모 ? " · " + d.메모 : ""}</summary>
          <pre>${안전(d.프롬프트).replace(/⟨([^⟩]*)⟩/g, "<mark>⟨$1⟩</mark>")}</pre></details>` : ""}
      </div>
    </div>`).join("");

  // 복사 — 클립보드가 막힌 환경이면 예전 방식으로 한 번 더 시도
  async function 복사(글) {
    try { await navigator.clipboard.writeText(글); return true; } catch (e) {}
    const t = document.createElement("textarea");
    t.value = 글; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    t.remove(); return ok;
  }
  document.getElementById("steps").addEventListener("click", async e => {
    const b = e.target.closest(".copy");
    if (!b) return;
    const ok = await 복사(단계들[b.dataset.i].프롬프트);
    b.textContent = ok ? "✓ 복사됐어요" : "아래 ‘프롬프트 보기’에서 직접 복사하세요";
    b.classList.toggle("done", ok);
    if (!ok) b.closest(".step").querySelector("details").open = true;
    setTimeout(() => { b.textContent = "📋 프롬프트 복사"; b.classList.remove("done"); }, 1800);
  });
</script>
</body>
</html>
