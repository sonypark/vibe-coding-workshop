<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김서연의 페이지</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    background: #f0f4f8;
    font-family: "Noto Sans CJK KR", "Apple SD Gothic Neo", sans-serif;
    display: flex;
    justify-content: center;
  }

  .dday {
    background: linear-gradient(135deg, #2c5a8a, #4a86c5);
    color: white; border-radius: 16px; padding: 24px;
    max-width: 420px; width: 100%; margin-bottom: 16px; text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .dday .num { font-size: 52px; font-weight: bold; line-height: 1.1; letter-spacing: -1px; }
  .dday .what { font-size: 14px; opacity: 0.85; margin-top: 6px; }
  .stack { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .card {
    background: white;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
  }
  .emoji { font-size: 56px; margin-bottom: 8px; }
  h1 { margin: 0 0 6px; font-size: 26px; color: #1a2a3a; }
  .intro { margin: 0 0 24px; color: #5a6b7c; font-size: 15px; line-height: 1.6; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
  .tag {
    background: #e3edf7; color: #2c5a8a;
    padding: 7px 14px; border-radius: 20px; font-size: 14px;
  }
  .btn {
    display: inline-block; background: #2c5a8a; color: white;
    padding: 12px 28px; border-radius: 10px;
    text-decoration: none; font-size: 15px; font-weight: bold;
  }
</style>
</head>
<body>
  <div class="stack">
  <div class="dday">
    <div class="num" id="dday">D-297</div>
    <div class="what">수능까지</div>
  </div>
  <div class="card">
    <div class="emoji">🌊</div>
    <h1>김서연</h1>
    <p class="intro">바다랑 코딩을 좋아하는<br>고등학교 2학년입니다</p>
    <div class="tags">
      <span class="tag">#농구</span>
      <span class="tag">#뉴진스</span>
      <span class="tag">#해양생물</span>
    </div>
    <a class="btn" href="https://github.com">내 깃허브 →</a>
  </div>
  </div>

<script>
  // 여기 날짜만 바꾸면 됩니다
  const 목표날짜 = new Date("2027-11-18");
  const 오늘 = new Date();
  const 남은날 = Math.ceil((목표날짜 - 오늘) / (1000 * 60 * 60 * 24));
  document.getElementById("dday").textContent = "D-" + 남은날;
</script>
</body>
</html>
